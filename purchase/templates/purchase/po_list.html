{% extends 'purchase/base.html' %}

{% block content %}
<h2>📋 Purchase Orders</h2>

<!-- Filters -->
<div class="card mb-4">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0">🔍 Filters</h5>
    </div>
    <div class="card-body">
        <div class="row">
            <div class="col-md-3">
                <label class="form-label">Vendor</label>
                <select class="form-select" id="filterVendor">
                    <option value="">All Vendors</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Status</label>
                <select class="form-select" id="filterStatus">
                    <option value="">All Status</option>
                    <option value="sent">Sent</option>
                    <option value="partially_received">Partially Received</option>
                    <option value="closed">Closed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Single Date</label>
                <input type="date" class="form-control" id="filterDate">
            </div>
            <div class="col-md-3">
                <label class="form-label">Date Range</label>
                <div class="input-group">
                    <input type="date" class="form-control" id="filterDateFrom" placeholder="From">
                    <input type="date" class="form-control" id="filterDateTo" placeholder="To">
                </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-12">
                <button class="btn btn-primary" onclick="applyFilters()">Apply Filters</button>
                <button class="btn btn-secondary" onclick="resetFilters()">Reset</button>
            </div>
        </div>
    </div>
</div>

<!-- Create PO Button -->
<div class="mb-3">
    <button class="btn btn-success" data-bs-toggle="collapse" data-bs-target="#createPOForm">+ Create New PO</button>
</div>

<!-- Create/Edit PO Form -->
<div class="collapse mb-4" id="createPOForm">
    <div class="card">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0" id="poFormTitle">Create New PO</h5>
        </div>
        <div class="card-body">
            <form id="poForm">
                <div class="row">
                    <div class="col-md-4">
                        <select class="form-select" id="poVendor" required>
                            <option value="">Select Vendor</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <input type="date" class="form-control" id="poExpected" required>
                    </div>
                    <div class="col-md-4">
                        <button type="button" class="btn btn-secondary" onclick="addItemRow()">+ Add Item</button>
                    </div>
                </div>
                <div id="itemsContainer" class="mt-3"></div>
                <div id="totalDisplay" class="mt-3"></div>
                <button type="submit" class="btn btn-success mt-3" id="poSubmitBtn">Create PO</button>
                <button type="button" class="btn btn-secondary mt-3" onclick="cancelEdit()" id="cancelEditBtn" style="display:none;">Cancel Edit</button>
            </form>
        </div>
    </div>
</div>

<!-- PO Table -->
<div class="card">
    <div class="card-header bg-secondary text-white">
        <h5 class="mb-0">PO List</h5>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-bordered table-hover" id="poTable">
                <thead>
                    <tr>
                        <th>S.No</th>
                        <th>PO #</th>
                        <th>Vendor</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Subtotal</th>
                        <th>Tax</th>
                        <th>Total</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="poTableBody">
                    <tr>
                        <td colspan="9" class="text-center text-muted">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- View PO Modal -->
<div class="modal fade" id="viewPOModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title">📄 PO Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="poDetailContent">
                Loading...
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<!-- Edit PO Modal -->
<div class="modal fade" id="editPOModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title">✏️ Edit PO</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="editPOContent">
                Loading...
            </div>
        </div>
    </div>
</div>

<script>
    // ==================== LOAD POs ====================
    async function loadPOs() {
        console.log('🔄 Loading POs...');
        const tbody = document.getElementById('poTableBody');
        tbody.innerHTML = `<tr><td colspan="9" class="text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <br>Loading POs...
        </td></tr>`;
        
        try {
            // Get filter values
            const vendor = document.getElementById('filterVendor').value;
            const status = document.getElementById('filterStatus').value;
            const date = document.getElementById('filterDate').value;
            const dateFrom = document.getElementById('filterDateFrom').value;
            const dateTo = document.getElementById('filterDateTo').value;
            
            let url = '/api/pos/';
            const params = new URLSearchParams();
            if (vendor) params.append('vendor', vendor);
            if (status) params.append('status', status);
            if (date) params.append('date', date);
            if (dateFrom) params.append('date_from', dateFrom);
            if (dateTo) params.append('date_to', dateTo);
            
            if (params.toString()) url += '?' + params.toString();
            
            console.log('📡 Fetching:', url);
            
            const response = await fetch(url);
            console.log('📡 Response status:', response.status);
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const pos = await response.json();
            console.log('✅ POs received:', pos);
            console.log('📊 Number of POs:', pos.length);
            
            if (pos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="text-center text-muted">No POs found</td></tr>`;
                return;
            }
            
            tbody.innerHTML = pos.map((po, index) => {
                // Convert to numbers safely
                const subtotal = parseFloat(po.subtotal) || 0;
                const taxTotal = parseFloat(po.tax_total) || 0;
                const totalAmount = parseFloat(po.total_amount) || 0;
                
                return `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${po.po_number || 'N/A'}</strong></td>
                        <td>${po.vendor || 'N/A'}</td>
                        <td>${po.order_date || 'N/A'}</td>
                        <td>
                            <span class="badge 
                                ${po.status === 'closed' ? 'bg-success' : 
                                  po.status === 'sent' ? 'bg-primary' : 
                                  po.status === 'cancelled' ? 'bg-danger' : 
                                  po.status === 'partially_received' ? 'bg-warning text-dark' : 
                                  'bg-secondary'}">
                                ${(po.status || 'unknown').replace('_', ' ').toUpperCase()}
                            </span>
                        </td>
                        <td>₹${subtotal.toFixed(2)}</td>
                        <td>₹${taxTotal.toFixed(2)}</td>
                        <td><strong>₹${totalAmount.toFixed(2)}</strong></td>
                        <td>
                            <button class="btn btn-sm btn-info" onclick="viewPO(${po.id})" title="View PO">👁️</button>
                            <button class="btn btn-sm btn-warning" onclick="editPO(${po.id})" title="Edit PO">✏️</button>
                            <button class="btn btn-sm btn-danger" onclick="deletePO(${po.id})" title="Delete PO">🗑️</button>
                            <button class="btn btn-sm btn-secondary" onclick="downloadPDF(${po.id})" title="Download PDF">📄</button>
                        </td>
                    </tr>
                `;
            }).join('');
            
            console.log('✅ Table updated successfully!');
            
        } catch (error) {
            console.error('❌ Error loading POs:', error);
            tbody.innerHTML = `<tr><td colspan="9" class="text-center text-danger">Error: ${error.message}</td></tr>`;
        }
    }

    // ==================== PDF DOWNLOAD ====================
    async function downloadPDF(poId) {
        console.log('📄 Downloading PDF for PO ID:', poId);
        try {
            const response = await fetch(`/api/pos/${poId}/download_pdf/`);
            console.log('📡 Response status:', response.status);
            
            if (response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `PO_${poId}.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
                console.log('✅ PDF downloaded successfully!');
            } else {
                const errorText = await response.text();
                console.error('❌ PDF download failed:', errorText);
                alert('PDF download failed. Please check console for details.');
            }
        } catch (error) {
            console.error('❌ Error downloading PDF:', error);
            alert('Error downloading PDF: ' + error.message);
        }
    }

    // ==================== VIEW PO ====================
    async function viewPO(id) {
        const modal = new bootstrap.Modal(document.getElementById('viewPOModal'));
        const content = document.getElementById('poDetailContent');
        content.innerHTML = 'Loading...';
        modal.show();
        
        try {
            const res = await fetch(`/api/pos/${id}/`);
            const po = await res.json();
            
            // Convert to numbers
            const subtotal = parseFloat(po.subtotal) || 0;
            const taxTotal = parseFloat(po.tax_total) || 0;
            const totalAmount = parseFloat(po.total_amount) || 0;
            
            content.innerHTML = `
                <div class="row mb-3">
                    <div class="col-md-6">
                        <p><strong>PO Number:</strong> ${po.po_number}</p>
                        <p><strong>Vendor:</strong> ${po.vendor}</p>
                        <p><strong>Order Date:</strong> ${po.order_date}</p>
                        <p><strong>Expected Delivery:</strong> ${po.expected_delivery || 'N/A'}</p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>Status:</strong> <span class="badge bg-primary">${po.status}</span></p>
                        <p><strong>Subtotal:</strong> ₹${subtotal.toFixed(2)}</p>
                        <p><strong>Tax Total:</strong> ₹${taxTotal.toFixed(2)}</p>
                        <p><strong>Grand Total:</strong> ₹${totalAmount.toFixed(2)}</p>
                    </div>
                </div>
                <hr>
                <h6>Items</h6>
                <div class="table-responsive">
                    <table class="table table-sm table-bordered">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Product</th>
                                <th>HSN</th>
                                <th>GST%</th>
                                <th>Qty</th>
                                <th>Unit Price</th>
                                <th>Subtotal</th>
                                <th>Tax</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${po.items.map((item, idx) => {
                                const itemSubtotal = parseFloat(item.subtotal) || 0;
                                const itemTax = parseFloat(item.tax_amount) || 0;
                                const itemTotal = parseFloat(item.total_price) || 0;
                                const unitPrice = parseFloat(item.unit_price) || 0;
                                const quantity = parseFloat(item.quantity) || 0;
                                const gstRate = parseFloat(item.gst_rate) || 0;
                                
                                return `
                                    <tr>
                                        <td>${idx + 1}</td>
                                        <td>${item.product_name}</td>
                                        <td>${item.hsn_code || '-'}</td>
                                        <td>${gstRate}%</td>
                                        <td>${quantity}</td>
                                        <td>₹${unitPrice.toFixed(2)}</td>
                                        <td>₹${itemSubtotal.toFixed(2)}</td>
                                        <td>₹${itemTax.toFixed(2)}</td>
                                        <td>₹${itemTotal.toFixed(2)}</td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        } catch (error) {
            content.innerHTML = `<div class="alert alert-danger">Error loading PO: ${error.message}</div>`;
        }
    }

    // ==================== EDIT PO ====================
    async function editPO(id) {
        console.log('✏️ Editing PO:', id);
        const modal = new bootstrap.Modal(document.getElementById('editPOModal'));
        const content = document.getElementById('editPOContent');
        content.innerHTML = 'Loading...';
        modal.show();
        
        try {
            const res = await fetch(`/api/pos/${id}/`);
            const po = await res.json();
            
            // Get all vendors for dropdown
            const vendorRes = await fetch('/api/vendors/');
            const vendors = await vendorRes.json();
            
            let itemsHtml = po.items.map((item, idx) => `
                <div class="row item-row mb-2">
                    <div class="col-md-3">
                        <input type="text" class="form-control" placeholder="Product Name" name="product_name" value="${item.product_name}" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" class="form-control" placeholder="HSN Code" name="hsn_code" value="${item.hsn_code || ''}">
                    </div>
                    <div class="col-md-2">
                        <input type="number" step="0.01" class="form-control" placeholder="GST %" name="gst_rate" value="${item.gst_rate || 18}">
                    </div>
                    <div class="col-md-2">
                        <input type="number" step="0.01" class="form-control" placeholder="Qty" name="quantity" value="${item.quantity}" required>
                    </div>
                    <div class="col-md-2">
                        <input type="number" step="0.01" class="form-control" placeholder="Unit Price" name="unit_price" value="${item.unit_price}" required>
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.parentElement.remove()">✕</button>
                    </div>
                </div>
            `).join('');
            
            content.innerHTML = `
                <form id="editPOForm" data-id="${po.id}">
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label">Vendor</label>
                            <select class="form-select" name="vendor" required>
                                ${vendors.map(v => `
                                    <option value="${v.id}" ${v.id === po.vendor ? 'selected' : ''}>${v.name}</option>
                                `).join('')}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Expected Delivery</label>
                            <input type="date" class="form-control" name="expected_delivery" value="${po.expected_delivery || ''}" required>
                        </div>
                    </div>
                    <hr>
                    <h6>Items</h6>
                    <div id="editItemsContainer">
                        ${itemsHtml}
                    </div>
                    <button type="button" class="btn btn-secondary btn-sm mt-2" onclick="addEditItemRow()">+ Add Item</button>
                    <div class="row mt-3">
                        <div class="col-md-12">
                            <button type="submit" class="btn btn-success">Update PO</button>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        </div>
                    </div>
                </form>
            `;
            
            // Add form submit handler
            document.getElementById('editPOForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const formId = e.target.dataset.id;
                
                const items = [];
                const itemRows = document.querySelectorAll('#editItemsContainer .item-row');
                itemRows.forEach(row => {
                    const product_name = row.querySelector('[name="product_name"]').value;
                    const hsn_code = row.querySelector('[name="hsn_code"]').value;
                    const gst_rate = parseFloat(row.querySelector('[name="gst_rate"]').value) || 0;
                    const quantity = parseFloat(row.querySelector('[name="quantity"]').value) || 0;
                    const unit_price = parseFloat(row.querySelector('[name="unit_price"]').value) || 0;
                    
                    if (product_name && quantity > 0) {
                        items.push({ product_name, hsn_code, gst_rate, quantity, unit_price });
                    }
                });
                
                if (items.length === 0) {
                    alert('Please add at least one item');
                    return;
                }
                
                const data = {
                    vendor: parseInt(formData.get('vendor')),
                    expected_delivery: formData.get('expected_delivery'),
                    items: items
                };
                
                try {
                    const response = await fetch(`/api/pos/${formId}/`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(data)
                    });
                    
                    if (response.ok) {
                        alert('✅ PO updated successfully!');
                        modal.hide();
                        loadPOs();
                    } else {
                        const error = await response.json();
                        alert('Error: ' + JSON.stringify(error));
                    }
                } catch (error) {
                    alert('Error: ' + error.message);
                }
            });
            
        } catch (error) {
            content.innerHTML = `<div class="alert alert-danger">Error loading PO: ${error.message}</div>`;
        }
    }

    // ==================== ADD EDIT ITEM ROW ====================
    function addEditItemRow() {
        const container = document.getElementById('editItemsContainer');
        const row = document.createElement('div');
        row.className = 'row item-row mb-2';
        row.innerHTML = `
            <div class="col-md-3">
                <input type="text" class="form-control" placeholder="Product Name" name="product_name" required>
            </div>
            <div class="col-md-2">
                <input type="text" class="form-control" placeholder="HSN Code" name="hsn_code">
            </div>
            <div class="col-md-2">
                <input type="number" step="0.01" class="form-control" placeholder="GST %" name="gst_rate" value="18">
            </div>
            <div class="col-md-2">
                <input type="number" step="0.01" class="form-control" placeholder="Qty" name="quantity" required>
            </div>
            <div class="col-md-2">
                <input type="number" step="0.01" class="form-control" placeholder="Unit Price" name="unit_price" required>
            </div>
            <div class="col-md-1">
                <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.parentElement.remove()">✕</button>
            </div>
        `;
        container.appendChild(row);
    }

    // ==================== DELETE PO ====================
    async function deletePO(id) {
        if (!confirm('⚠️ Are you sure you want to delete this PO? This action cannot be undone.')) {
            return;
        }
        
        try {
            const response = await fetch(`/api/pos/${id}/`, {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'}
            });
            
            if (response.ok) {
                alert('✅ PO deleted successfully!');
                loadPOs();
            } else {
                const error = await response.json();
                alert('Error: ' + JSON.stringify(error));
            }
        } catch (error) {
            alert('Error: ' + error.message);
        }
    }

    // ==================== FILTERS ====================
    async function loadVendors() {
        try {
            const res = await fetch('/api/vendors/');
            const vendors = await res.json();
            
            const poSel = document.getElementById('poVendor');
            poSel.innerHTML = '<option value="">Select Vendor</option>' +
                vendors.map(v => `<option value="${v.id}">${v.name}</option>`).join('');
            
            const filterSel = document.getElementById('filterVendor');
            filterSel.innerHTML = '<option value="">All Vendors</option>' +
                vendors.map(v => `<option value="${v.id}">${v.name}</option>`).join('');
        } catch (error) {
            console.error('Error loading vendors:', error);
        }
    }

    function applyFilters() {
        loadPOs();
    }

    function resetFilters() {
        document.getElementById('filterVendor').value = '';
        document.getElementById('filterStatus').value = '';
        document.getElementById('filterDate').value = '';
        document.getElementById('filterDateFrom').value = '';
        document.getElementById('filterDateTo').value = '';
        loadPOs();
    }

    // ==================== CREATE PO ====================
    function addItemRow() {
        const container = document.getElementById('itemsContainer');
        const row = document.createElement('div');
        row.className = 'item-row row mb-2';
        row.innerHTML = `
            <div class="col-md-3">
                <input type="text" class="form-control" placeholder="Product Name" name="product_name" required>
            </div>
            <div class="col-md-2">
                <input type="text" class="form-control" placeholder="HSN Code" name="hsn_code">
            </div>
            <div class="col-md-2">
                <input type="number" step="0.01" class="form-control" placeholder="GST %" name="gst_rate" value="18">
            </div>
            <div class="col-md-2">
                <input type="number" step="0.01" class="form-control" placeholder="Qty" name="quantity" required>
            </div>
            <div class="col-md-2">
                <input type="number" step="0.01" class="form-control" placeholder="Unit Price" name="unit_price" required>
            </div>
            <div class="col-md-1">
                <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.parentElement.remove(); calculateTotal();">✕</button>
            </div>
        `;
        container.appendChild(row);
        row.querySelectorAll('input').forEach(input => {
            input.addEventListener('change', calculateTotal);
            input.addEventListener('keyup', calculateTotal);
        });
        calculateTotal();
    }

    function calculateTotal() {
        const rows = document.querySelectorAll('#itemsContainer .item-row');
        let subtotalTotal = 0, taxTotal = 0, grandTotal = 0;
        
        rows.forEach(row => {
            const qty = parseFloat(row.querySelector('[name="quantity"]').value) || 0;
            const unitPrice = parseFloat(row.querySelector('[name="unit_price"]').value) || 0;
            const gstRate = parseFloat(row.querySelector('[name="gst_rate"]').value) || 0;
            
            const subtotal = qty * unitPrice;
            const tax = (subtotal * gstRate) / 100;
            const total = subtotal + tax;
            
            subtotalTotal += subtotal;
            taxTotal += tax;
            grandTotal += total;
        });
        
        const totalDisplay = document.getElementById('totalDisplay');
        if (rows.length > 0) {
            totalDisplay.innerHTML = `
                <div class="card p-3 bg-light">
                    <div class="row">
                        <div class="col-md-4"><strong>Subtotal:</strong> ₹${subtotalTotal.toFixed(2)}</div>
                        <div class="col-md-4"><strong>Total Tax:</strong> ₹${taxTotal.toFixed(2)}</div>
                        <div class="col-md-4"><strong>Grand Total:</strong> ₹${grandTotal.toFixed(2)}</div>
                    </div>
                </div>
            `;
        } else {
            totalDisplay.innerHTML = '';
        }
    }

    // ==================== PO FORM SUBMIT ====================
    document.getElementById('poForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const vendor = document.getElementById('poVendor').value;
        const expected = document.getElementById('poExpected').value;
        const itemRows = document.querySelectorAll('#itemsContainer .item-row');
        const items = Array.from(itemRows).map(row => ({
            product_name: row.querySelector('[name="product_name"]').value,
            hsn_code: row.querySelector('[name="hsn_code"]').value,
            gst_rate: parseFloat(row.querySelector('[name="gst_rate"]').value) || 0,
            quantity: parseFloat(row.querySelector('[name="quantity"]').value) || 0,
            unit_price: parseFloat(row.querySelector('[name="unit_price"]').value) || 0,
        })).filter(item => item.product_name && item.quantity > 0);

        if (!vendor || items.length === 0) {
            alert('Please select vendor and add at least one item');
            return;
        }

        const data = { vendor: parseInt(vendor), expected_delivery: expected, items };
        
        try {
            const response = await fetch('/api/pos/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            if (response.ok) {
                const po = await response.json();
                alert('✅ PO created successfully!');
                
                // Automatic PDF Download
                console.log('🔄 Downloading PDF for PO:', po.id);
                await downloadPDF(po.id);
                
                document.getElementById('poForm').reset();
                document.getElementById('itemsContainer').innerHTML = '';
                document.getElementById('totalDisplay').innerHTML = '';
                document.getElementById('createPOForm').classList.remove('show');
                loadPOs();
            } else {
                const error = await response.json();
                alert('Error: ' + JSON.stringify(error));
            }
        } catch (error) {
            alert('Error: ' + error.message);
        }
    });

    // ==================== INITIALIZE ====================
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 Page loaded, initializing...');
        loadVendors();
        loadPOs();
        addItemRow();
    });
</script>
{% endblock %}
