{% extends 'purchase/base.html' %}

{% block content %}
<h2>📦 Receive Goods against PO</h2>

<div class="card">
    <div class="card-body">
        <form id="receivingForm">
            <div class="row">
                <div class="col-md-6">
                    <select class="form-select" id="receivePo" required>
                        <option value="">Select PO (Sent/Partially Received)</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <input type="text" class="form-control" id="receiveNotes" placeholder="Notes (optional)">
                </div>
            </div>
            
            <div class="row mt-3">
                <div class="col-md-4">
                    <input type="text" class="form-control" id="invoiceNo" placeholder="Invoice No *" required>
                </div>
                <div class="col-md-4">
                    <input type="date" class="form-control" id="invoiceDate">
                </div>
                <div class="col-md-4">
                    <input type="number" step="0.01" class="form-control" id="gstPercentage" placeholder="GST % (e.g., 18)">
                </div>
            </div>
            
            <div id="poItemsDisplay" class="mt-3" style="display:none;">
                <h5>PO Items</h5>
                <div class="table-responsive">
                    <table class="table table-sm table-bordered">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Ordered</th>
                                <th>Received so far</th>
                                <th>Remaining</th>
                                <th>Unit Price</th>
                                <th>Receive Qty</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody id="poItemsBody"></tbody>
                    </table>
                </div>
                <div class="row mt-3">
                    <div class="col-md-4 offset-md-8">
                        <div class="card">
                            <div class="card-body">
                                <p><strong>Subtotal:</strong> ₹<span id="subtotal">0.00</span></p>
                                <p><strong>GST (<span id="gstLabel">0</span>%):</strong> ₹<span id="gstAmount">0.00</span></p>
                                <h5><strong>Total:</strong> ₹<span id="totalAmount">0.00</span></h5>
                            </div>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-success mt-3">Submit Receiving</button>
            </div>
        </form>
    </div>
</div>

<script>
    let currentPoItems = [];

    async function loadEligiblePOs() {
        try {
            const res = await fetch('/api/pos/');
            const pos = await res.json();
            const eligible = pos.filter(p => p.status === 'sent' || p.status === 'partially_received');
            const sel = document.getElementById('receivePo');
            sel.innerHTML = '<option value="">Select PO</option>' +
                eligible.map(p => `<option value="${p.id}">${p.po_number} - ${p.vendor}</option>`).join('');
        } catch (error) {
            console.error('Error loading POs:', error);
        }
    }

    document.getElementById('receivePo').addEventListener('change', async function() {
        const poId = this.value;
        const display = document.getElementById('poItemsDisplay');
        if (!poId) { 
            display.style.display = 'none'; 
            return; 
        }
        
        try {
            const res = await fetch(`/api/pos/${poId}/`);
            const po = await res.json();
            
            const recRes = await fetch(`/api/receivings/?po=${poId}`);
            const receivings = await recRes.json();
            
            const receivedMap = {};
            receivings.forEach(rec => {
                rec.items.forEach(item => {
                    receivedMap[item.po_item] = (receivedMap[item.po_item] || 0) + item.received_qty;
                });
            });

            currentPoItems = po.items;
            const tbody = document.getElementById('poItemsBody');
            tbody.innerHTML = po.items.map((item, index) => {
                const received = receivedMap[item.id] || 0;
                const remaining = item.quantity - received;
                return `
                    <tr>
                        <td><strong>${item.product_name}</strong></td>
                        <td>${item.quantity}</td>
                        <td>${received}</td>
                        <td>${remaining}</td>
                        <td>
                            <input type="number" step="0.01" class="form-control unit-price" 
                                   data-index="${index}" value="${item.unit_price}">
                        </td>
                        <td>
                            <input type="number" step="0.01" class="form-control receive-qty" 
                                   data-po-item-id="${item.id}" data-index="${index}"
                                   max="${remaining}" min="0" placeholder="Qty" required>
                        </td>
                        <td class="item-total" data-index="${index}">0.00</td>
                    </tr>
                `;
            }).join('');
            display.style.display = 'block';
            calculateTotals();
        } catch (error) {
            console.error('Error loading PO items:', error);
            alert('Error loading PO items: ' + error.message);
        }
    });

    // Calculate totals on input change
    document.addEventListener('input', function(e) {
        if (e.target.classList.contains('receive-qty') || e.target.classList.contains('unit-price')) {
            calculateTotals();
        }
    });

    function calculateTotals() {
        const qtyInputs = document.querySelectorAll('.receive-qty');
        let subtotal = 0;
        
        qtyInputs.forEach((input, index) => {
            const qty = parseFloat(input.value) || 0;
            const unitPriceInput = document.querySelector(`.unit-price[data-index="${index}"]`);
            const unitPrice = parseFloat(unitPriceInput ? unitPriceInput.value : 0) || 0;
            const total = qty * unitPrice;
            
            const totalCell = document.querySelector(`.item-total[data-index="${index}"]`);
            if (totalCell) {
                totalCell.textContent = total.toFixed(2);
            }
            subtotal += total;
        });
        
        const gstPercent = parseFloat(document.getElementById('gstPercentage').value) || 0;
        const gstAmount = (subtotal * gstPercent) / 100;
        const total = subtotal + gstAmount;
        
        document.getElementById('subtotal').textContent = subtotal.toFixed(2);
        document.getElementById('gstLabel').textContent = gstPercent;
        document.getElementById('gstAmount').textContent = gstAmount.toFixed(2);
        document.getElementById('totalAmount').textContent = total.toFixed(2);
    }

    document.getElementById('receivingForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const poId = document.getElementById('receivePo').value;
        const notes = document.getElementById('receiveNotes').value;
        const invoiceNo = document.getElementById('invoiceNo').value.trim();
        const invoiceDate = document.getElementById('invoiceDate').value;
        const gstPercentage = parseFloat(document.getElementById('gstPercentage').value) || 0;
        
        // ✅ Validate Invoice No is required
        if (!invoiceNo) {
            alert('⚠️ Invoice Number is required. Please enter invoice number.');
            document.getElementById('invoiceNo').focus();
            return;
        }
        
        if (!poId) {
            alert('⚠️ Please select a PO.');
            return;
        }
        
        const qtyInputs = document.querySelectorAll('.receive-qty');
        const items = [];
        let hasError = false;
        let hasPositiveQty = false;
        
        qtyInputs.forEach((input, index) => {
            const qty = parseFloat(input.value);
            if (qty > 0) {
                hasPositiveQty = true;
                const unitPriceInput = document.querySelector(`.unit-price[data-index="${index}"]`);
                const unitPrice = parseFloat(unitPriceInput ? unitPriceInput.value : 0) || 0;
                items.push({
                    po_item: parseInt(input.dataset.poItemId),
                    received_qty: qty,
                    unit_price: unitPrice,
                    accepted: true,
                    reject_reason: ''
                });
            } else if (qty < 0) {
                hasError = true;
            }
        });
        
        if (hasError) {
            alert('Quantity cannot be negative.');
            return;
        }
        
        if (!hasPositiveQty || items.length === 0) {
            alert('Please enter at least one positive quantity.');
            return;
        }
        
        const data = { 
            po: parseInt(poId), 
            notes,
            invoice_no: invoiceNo,
            invoice_date: invoiceDate,
            gst_percentage: gstPercentage,
            items 
        };
        
        try {
            const response = await fetch('/api/receivings/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            if (response.ok) {
                const result = await response.json();
                alert('✅ Receiving recorded successfully!\nInvoice: ' + invoiceNo);
                document.getElementById('receivingForm').reset();
                document.getElementById('poItemsDisplay').style.display = 'none';
                document.getElementById('invoiceNo').value = '';
                document.getElementById('invoiceDate').value = '';
                document.getElementById('gstPercentage').value = '';
                document.getElementById('subtotal').textContent = '0.00';
                document.getElementById('gstAmount').textContent = '0.00';
                document.getElementById('totalAmount').textContent = '0.00';
                document.getElementById('gstLabel').textContent = '0';
                loadEligiblePOs();
            } else {
                const errorData = await response.json();
                let errorMsg = 'Error: ';
                if (errorData && typeof errorData === 'object') {
                    errorMsg += JSON.stringify(errorData);
                } else {
                    errorMsg += errorData || 'Unknown error';
                }
                alert(errorMsg);
            }
        } catch (error) {
            alert('Error submitting receiving: ' + error.message);
        }
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
        loadEligiblePOs();
    });
</script>
{% endblock %}
