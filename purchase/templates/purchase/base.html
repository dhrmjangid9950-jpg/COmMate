<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COmMate - Purchase Order System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { 
            padding-top: 2rem; 
            background-color: #f4f6f9;
        }
        .container { max-width: 1200px; }
        
        /* Navbar Styles */
        .navbar-brand {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a237e !important;
        }
        .navbar-brand span {
            color: #e65100;
        }
        .navbar-brand .logo-icon {
            font-size: 2rem;
            margin-right: 10px;
        }
        .nav-link {
            font-weight: 500;
            color: #333 !important;
            padding: 0.5rem 1.2rem !important;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .nav-link:hover {
            background-color: #e8eaf6;
            color: #1a237e !important;
        }
        .nav-link.active {
            background-color: #1a237e !important;
            color: #fff !important;
        }
        
        /* Card Styles */
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .card-header {
            border-radius: 12px 12px 0 0 !important;
            font-weight: 600;
        }
        
        /* Button Styles */
        .btn-primary {
            background-color: #1a237e;
            border-color: #1a237e;
        }
        .btn-primary:hover {
            background-color: #0d1445;
            border-color: #0d1445;
        }
        
        .form-row { margin-bottom: 1rem; }
        .item-row { background: #f8f9fa; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        .card { margin-bottom: 1rem; }
        .btn-block { display: block; width: 100%; }
        .btn-lg { padding: 1rem; font-size: 1.25rem; }
        
        /* Badge Styles */
        .badge {
            padding: 0.4rem 0.8rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">
                <span class="logo-icon">🏢</span>
                COm<span>Mate</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/vendors/' in request.path %}active{% endif %}" href="/vendors/">
                            <i class="bi bi-building"></i> Vendors
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/pos/' in request.path %}active{% endif %}" href="/pos/">
                            <i class="bi bi-cart-plus"></i> Purchase Orders
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/receiving-list/' in request.path %}active{% endif %}" href="/receiving-list/">
                            <i class="bi bi-list-ul"></i> Receivings
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="text-center text-muted py-4 mt-4" style="font-size:0.9rem;">
        &copy; 2026 <strong>COmMate</strong> - Purchase Order System. All rights reserved.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
