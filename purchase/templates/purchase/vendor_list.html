{% extends 'purchase/base.html' %}

{% block content %}
<h2>🏢 Vendors</h2>

<!-- Create Vendor Button -->
<div class="mb-3">
    <button class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#createVendorForm">
        <i class="bi bi-plus-circle"></i> Add New Vendor
    </button>
</div>

<!-- Create Vendor Form - Collapsible -->
<div class="collapse mb-4" id="createVendorForm">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="bi bi-building-add"></i> Create New Vendor</h5>
        </div>
        <div class="card-body">
            <form id="vendorForm">
                <div class="row">
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="vendorName" placeholder="Company Name" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="vendorContactPerson" placeholder="Contact Person">
                    </div>
                    <div class="col-md-4">
                        <input type="email" class="form-control" id="vendorEmail" placeholder="Email">
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="vendorPhone" placeholder="Phone">
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="vendorGST" placeholder="GST No.">
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="vendorPAN" placeholder="PAN No.">
                    </div>
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="vendorAddress" placeholder="Address">
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="vendorBankName" placeholder="Bank Name">
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="vendorBankAccount" placeholder="Bank Account No.">
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="vendorIFSC" placeholder="IFSC Code">
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-md-12">
                        <button type="submit" class="btn btn-success">Create Vendor</button>
                        <button type="button" class="btn btn-secondary" data-bs-toggle="collapse" data-bs-target="#createVendorForm">Cancel</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Vendor Table -->
<div class="card">
    <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-building"></i> Vendor List</h5>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-bordered table-hover" id="vendorTable">
                <thead>
                    <tr>
                        <th style="width:4%">#</th>
                        <th style="width:12%">Reg. No.</th>
                        <th style="width:18%">Company Name</th>
                        <th style="width:14%">Contact Person</th>
                        <th style="width:18%">Email</th>
                        <th style="width:12%">Phone</th>
                        <th style="width:12%">GST</th>
                        <th style="width:10%">Action</th>
                    </tr>
                </thead>
                <tbody id="vendorTableBody">
                    <tr>
                        <td colspan="8" class="text-center text-muted">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Vendor Ledger Modal -->
<div class="modal fade" id="vendorLedgerModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title"><i class="bi bi-journal"></i> Vendor Ledger</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="vendorLedgerContent">
                Loading...
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<!-- Add Payment Modal -->
<div class="modal fade" id="addPaymentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="bi bi-cash"></i> Add Payment</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="paymentForm">
                    <input type="hidden" id="paymentVendorId">
                    <div class="mb-3">
                        <label class="form-label">Payment Mode</label>
                        <select class="form-select" id="paymentMode" required>
                            <option value="">Select Mode</option>
                            <option value="cash">Cash</option>
                            <option value="bank_transfer">Bank Transfer</option>
                            <option value="cheque">Cheque</option>
                            <option value="upi">UPI</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount (₹)</label>
                        <input type="number" step="0.01" class="form-control" id="paymentAmount" placeholder="Enter amount" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Reference No.</label>
                        <input type="text" class="form-control" id="paymentReference" placeholder="Cheque/Transaction/UPI ID">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea class="form-control" id="paymentNotes" rows="2" placeholder="Any notes"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="submitPayment()">Submit Payment</button>
            </div>
        </div>
    </div>
</div>

<!-- View Vendor Modal -->
<div class="modal fade" id="viewVendorModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title"><i class="bi bi-building"></i> Vendor Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="vendorDetailContent">
                Loading...
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-warning" onclick="editVendorFromView()" id="editFromViewBtn"><i class="bi bi-pencil"></i> Edit</button>
                <button type="button" class="btn btn-danger" onclick="deleteVendorFromView()" id="deleteFromViewBtn"><i class="bi bi-trash"></i> Delete</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<!-- Edit Vendor Modal -->
<div class="modal fade" id="editVendorModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title"><i class="bi bi-pencil-square"></i> Edit Vendor</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="editVendorContent">
                Loading...
            </div>
        </div>
    </div>
</div>

<script>
    // ==================== LOAD VENDORS ====================
    async function loadVendors() {
        console.log('🔄 Loading vendors...');
        const tbody = document.getElementById('vendorTableBody');
        tbody.innerHTML = `<tr><td colspan="8" class="text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <br>Loading vendors...
        </td></tr>`;
        
        try {
            const response = await fetch('/api/vendors/');
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const vendors = await response.json();
            console.log('✅ Vendors received:', vendors.length);
            
            if (vendors.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted">No vendors found</td></tr>`;
                return;
            }
            
            tbody.innerHTML = vendors.map((v, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td><small>${v.registration_no || '-'}</small></td>
                    <td><strong>${v.name}</strong></td>
                    <td>${v.contact_person || '-'}</td>
                    <td>${v.email || '-'}</td>
                    <td>${v.phone || '-'}</td>
                    <td>${v.gst_no || '-'}</td>
                    <td>
                        <div class="d-flex justify-content-center gap-1">
                            <button class="btn btn-sm btn-success py-0 px-2" onclick="viewVendorLedger(${v.id})" title="View Ledger" style="font-size:12px;">📒</button>
                            <button class="btn btn-sm btn-info py-0 px-2" onclick="viewVendor(${v.id})" title="View Vendor" style="font-size:12px;">👁️</button>
                            <button class="btn btn-sm btn-danger py-0 px-2" onclick="downloadVendorPDF(${v.id})" title="Download PDF" style="font-size:12px;">📄</button>
                            <button class="btn btn-sm btn-danger py-0 px-2" onclick="deleteVendor(${v.id})" title="Delete Vendor" style="font-size:12px;">🗑️</button>
                        </div>
                    </td>
                </tr>
            `).join('');
            
        } catch (error) {
            console.error('❌ Error loading vendors:', error);
            tbody.innerHTML = `<tr><td colspan="8" class="text-center text-danger">Error: ${error.message}</td></tr>`;
        }
    }

    // ==================== VENDOR LEDGER ====================
    let currentLedgerVendorId = null;

    async function viewVendorLedger(id) {
        currentLedgerVendorId = id;
        const modal = new bootstrap.Modal(document.getElementById('vendorLedgerModal'));
        const content = document.getElementById('vendorLedgerContent');
        content.innerHTML = 'Loading...';
        modal.show();
        
        try {
            const res = await fetch(`/api/vendors/${id}/ledger/`);
            const data = await res.json();
            
            const outstanding = parseFloat(data.summary.outstanding) || 0;
            
            let ledgerRows = '';
            if (data.ledger.length > 0) {
                ledgerRows = data.ledger.map((entry, idx) => `
                    <tr>
                        <td>${idx + 1}</td>
                        <td>${entry.date}</td>
                        <td>
                            <span class="badge ${entry.type === 'credit' ? 'bg-success' : entry.type === 'debit' ? 'bg-danger' : 'bg-secondary'}">
                                ${entry.type.toUpperCase()}
                            </span>
                        </td>
                        <td>${entry.invoice_no || '-'}</td>
                        <td>${entry.type === 'credit' ? `₹${parseFloat(entry.amount).toFixed(2)}` : '-'}</td>
                        <td>${entry.type === 'debit' ? `₹${parseFloat(entry.amount).toFixed(2)}` : '-'}</td>
                        <td><strong>₹${parseFloat(entry.balance).toFixed(2)}</strong></td>
                        <td>${entry.description || '-'}</td>
                    </tr>
                `).join('');
            } else {
                ledgerRows = `<tr><td colspan="8" class="text-center text-muted">No transactions found</td></tr>`;
            }
            
            // Payment History
            let paymentRows = '';
            if (data.payments && data.payments.length > 0) {
                paymentRows = data.payments.map((p, idx) => `
                    <tr>
                        <td>${idx + 1}</td>
                        <td>${p.date}</td>
                        <td><span class="badge bg-info">${p.mode}</span></td>
                        <td>₹${parseFloat(p.amount).toFixed(2)}</td>
                        <td>${p.reference_no || '-'}</td>
                        <td>${p.notes || '-'}</td>
                    </tr>
                `).join('');
            } else {
                paymentRows = `<tr><td colspan="6" class="text-center text-muted">No payments yet</td></tr>`;
            }
            
            content.innerHTML = `
                <!-- Vendor Info -->
                <div class="row mb-3">
                    <div class="col-md-8">
                        <h5><strong>${data.vendor.name}</strong></h5>
                        <p class="text-muted">${data.vendor.contact || ''} | ${data.vendor.phone || ''} | ${data.vendor.email || ''}</p>
                    </div>
                    <div class="col-md-4 text-end">
                        <button class="btn btn-primary btn-sm" onclick="openPaymentModal(${id})">
                            <i class="bi bi-cash"></i> Add Payment
                        </button>
                    </div>
                </div>
                
                <!-- Summary Cards -->
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card text-white bg-success">
                            <div class="card-body text-center">
                                <h6 class="card-title">Total Credit</h6>
                                <h4>₹${parseFloat(data.summary.total_credit).toFixed(2)}</h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-white bg-danger">
                            <div class="card-body text-center">
                                <h6 class="card-title">Total Debit</h6>
                                <h4>₹${parseFloat(data.summary.total_debit).toFixed(2)}</h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-white bg-secondary">
                            <div class="card-body text-center">
                                <h6 class="card-title">Opening Balance</h6>
                                <h4>₹${parseFloat(data.summary.opening_balance).toFixed(2)}</h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-white ${outstanding > 0 ? 'bg-warning' : 'bg-success'}">
                            <div class="card-body text-center">
                                <h6 class="card-title">Outstanding</h6>
                                <h4>₹${outstanding.toFixed(2)}</h4>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Ledger Table -->
                <ul class="nav nav-tabs" id="ledgerTabs">
                    <li class="nav-item">
                        <a class="nav-link active" data-bs-toggle="tab" href="#ledgerTab">Ledger</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#paymentTab">Payment History</a>
                    </li>
                </ul>
                <div class="tab-content mt-3">
                    <div class="tab-pane active" id="ledgerTab">
                        <div class="table-responsive">
                            <table class="table table-sm table-bordered">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Date</th>
                                        <th>Type</th>
                                        <th>Invoice No</th>
                                        <th>Credit</th>
                                        <th>Debit</th>
                                        <th>Balance</th>
                                        <th>Description</th>
                                    </tr>
                                </thead>
                                <tbody>${ledgerRows}</tbody>
                                <tfoot>
                                    <tr class="table-secondary">
                                        <td colspan="7" class="text-end"><strong>Closing Balance</strong></td>
                                        <td><strong>₹${outstanding.toFixed(2)}</strong></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                    <div class="tab-pane" id="paymentTab">
                        <div class="table-responsive">
                            <table class="table table-sm table-bordered">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Date</th>
                                        <th>Mode</th>
                                        <th>Amount</th>
                                        <th>Reference</th>
                                        <th>Notes</th>
                                    </tr>
                                </thead>
                                <tbody>${paymentRows}</tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
            
        } catch (error) {
            content.innerHTML = `<div class="alert alert-danger">Error loading ledger: ${error.message}</div>`;
        }
    }

    // ==================== OPEN PAYMENT MODAL ====================
    function openPaymentModal(vendorId) {
        document.getElementById('paymentVendorId').value = vendorId;
        document.getElementById('paymentForm').reset();
        const modal = new bootstrap.Modal(document.getElementById('addPaymentModal'));
        modal.show();
    }

    // ==================== SUBMIT PAYMENT ====================
    async function submitPayment() {
        const vendorId = document.getElementById('paymentVendorId').value;
        const paymentMode = document.getElementById('paymentMode').value;
        const amount = document.getElementById('paymentAmount').value;
        const referenceNo = document.getElementById('paymentReference').value;
        const notes = document.getElementById('paymentNotes').value;
        
        if (!paymentMode || !amount) {
            alert('Please select payment mode and enter amount');
            return;
        }
        
        try {
            const response = await fetch(`/api/vendors/${vendorId}/add_payment/`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    payment_mode: paymentMode,
                    amount: parseFloat(amount),
                    reference_no: referenceNo,
                    notes: notes
                })
            });
            
            if (response.ok) {
                alert('✅ Payment added successfully!');
                document.getElementById('addPaymentModal').querySelector('.btn-close').click();
                viewVendorLedger(vendorId);
            } else {
                const error = await response.json();
                alert('Error: ' + JSON.stringify(error));
            }
        } catch (error) {
            alert('Error: ' + error.message);
        }
    }

    // ==================== VIEW VENDOR ====================
    let currentVendorId = null;

    async function viewVendor(id) {
        currentVendorId = id;
        const modal = new bootstrap.Modal(document.getElementById('viewVendorModal'));
        const content = document.getElementById('vendorDetailContent');
        content.innerHTML = 'Loading...';
        modal.show();
        
        try {
            const res = await fetch(`/api/vendors/${id}/`);
            const vendor = await res.json();
            
            content.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>Registration No.:</strong> ${vendor.registration_no || 'N/A'}</p>
                        <p><strong>Company Name:</strong> ${vendor.name}</p>
                        <p><strong>Contact Person:</strong> ${vendor.contact_person || 'N/A'}</p>
                        <p><strong>Email:</strong> ${vendor.email || 'N/A'}</p>
                        <p><strong>Phone:</strong> ${vendor.phone || 'N/A'}</p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>Address:</strong> ${vendor.address || 'N/A'}</p>
                        <p><strong>GST No.:</strong> ${vendor.gst_no || 'N/A'}</p>
                        <p><strong>PAN No.:</strong> ${vendor.pan_no || 'N/A'}</p>
                        <p><strong>Bank Name:</strong> ${vendor.bank_name || 'N/A'}</p>
                        <p><strong>Bank Account No.:</strong> ${vendor.bank_account_no || 'N/A'}</p>
                        <p><strong>IFSC Code:</strong> ${vendor.bank_ifsc || 'N/A'}</p>
                    </div>
                </div>
            `;
        } catch (error) {
            content.innerHTML = `<div class="alert alert-danger">Error loading vendor: ${error.message}</div>`;
        }
    }

    // ==================== DELETE VENDOR FROM VIEW ====================
    function deleteVendorFromView() {
        if (currentVendorId) {
            document.getElementById('viewVendorModal').querySelector('.btn-close').click();
            deleteVendor(currentVendorId);
        }
    }

    // ==================== DELETE VENDOR ====================
    async function deleteVendor(id) {
        if (!confirm('⚠️ Are you sure you want to delete this vendor? This action cannot be undone.\n\nAll related POs and transactions will also be deleted.')) {
            return;
        }
        
        try {
            const response = await fetch(`/api/vendors/${id}/`, {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'}
            });
            
            if (response.ok) {
                alert('✅ Vendor deleted successfully!');
                loadVendors();
            } else {
                const error = await response.json();
                alert('Error: ' + JSON.stringify(error));
            }
        } catch (error) {
            alert('Error: ' + error.message);
        }
    }

    // ==================== EDIT VENDOR FROM VIEW ====================
    function editVendorFromView() {
        if (currentVendorId) {
            document.getElementById('viewVendorModal').querySelector('.btn-close').click();
            editVendor(currentVendorId);
        }
    }

    // ==================== EDIT VENDOR ====================
    async function editVendor(id) {
        const modal = new bootstrap.Modal(document.getElementById('editVendorModal'));
        const content = document.getElementById('editVendorContent');
        content.innerHTML = 'Loading...';
        modal.show();
        
        try {
            const res = await fetch(`/api/vendors/${id}/`);
            const vendor = await res.json();
            
            content.innerHTML = `
                <form id="editVendorForm" data-id="${vendor.id}">
                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label">Company Name *</label>
                            <input type="text" class="form-control" name="name" value="${vendor.name}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Contact Person</label>
                            <input type="text" class="form-control" name="contact_person" value="${vendor.contact_person || ''}">
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" value="${vendor.email || ''}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" name="phone" value="${vendor.phone || ''}">
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-12">
                            <label class="form-label">Address</label>
                            <textarea class="form-control" name="address" rows="2">${vendor.address || ''}</textarea>
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-6">
                            <label class="form-label">GST No.</label>
                            <input type="text" class="form-control" name="gst_no" value="${vendor.gst_no || ''}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">PAN No.</label>
                            <input type="text" class="form-control" name="pan_no" value="${vendor.pan_no || ''}">
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-4">
                            <label class="form-label">Bank Name</label>
                            <input type="text" class="form-control" name="bank_name" value="${vendor.bank_name || ''}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Bank Account No.</label>
                            <input type="text" class="form-control" name="bank_account_no" value="${vendor.bank_account_no || ''}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">IFSC Code</label>
                            <input type="text" class="form-control" name="bank_ifsc" value="${vendor.bank_ifsc || ''}">
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-12">
                            <button type="submit" class="btn btn-success">Update Vendor</button>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        </div>
                    </div>
                </form>
            `;
            
            document.getElementById('editVendorForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const formId = e.target.dataset.id;
                
                const data = {
                    name: formData.get('name'),
                    contact_person: formData.get('contact_person'),
                    email: formData.get('email'),
                    phone: formData.get('phone'),
                    address: formData.get('address'),
                    gst_no: formData.get('gst_no'),
                    pan_no: formData.get('pan_no'),
                    bank_name: formData.get('bank_name'),
                    bank_account_no: formData.get('bank_account_no'),
                    bank_ifsc: formData.get('bank_ifsc'),
                };
                
                if (!data.name) {
                    alert('Please enter company name');
                    return;
                }
                
                try {
                    const response = await fetch(`/api/vendors/${formId}/`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(data)
                    });
                    
                    if (response.ok) {
                        alert('✅ Vendor updated successfully!');
                        modal.hide();
                        loadVendors();
                    } else {
                        const error = await response.json();
                        alert('Error: ' + JSON.stringify(error));
                    }
                } catch (error) {
                    alert('Error: ' + error.message);
                }
            });
            
        } catch (error) {
            content.innerHTML = `<div class="alert alert-danger">Error loading vendor: ${error.message}</div>`;
        }
    }

    // ==================== PDF DOWNLOAD ====================
    async function downloadVendorPDF(vendorId) {
        console.log('📄 Downloading Vendor PDF for ID:', vendorId);
        try {
            const response = await fetch(`/api/vendors/${vendorId}/download_pdf/`);
            console.log('📡 Response status:', response.status);
            
            if (response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Vendor_${vendorId}.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
                console.log('✅ PDF downloaded successfully!');
            } else {
                const errorText = await response.text();
                console.error('❌ PDF download failed:', errorText);
                alert('PDF download failed. Please check console for details.');
            }
        } catch (error) {
            console.error('❌ Error downloading PDF:', error);
            alert('Error downloading PDF: ' + error.message);
        }
    }

    // ==================== CREATE VENDOR ====================
    document.getElementById('vendorForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const data = {
            name: document.getElementById('vendorName').value.trim(),
            contact_person: document.getElementById('vendorContactPerson').value.trim(),
            email: document.getElementById('vendorEmail').value.trim(),
            phone: document.getElementById('vendorPhone').value.trim(),
            address: document.getElementById('vendorAddress').value.trim(),
            gst_no: document.getElementById('vendorGST').value.trim(),
            pan_no: document.getElementById('vendorPAN').value.trim(),
            bank_name: document.getElementById('vendorBankName').value.trim(),
            bank_account_no: document.getElementById('vendorBankAccount').value.trim(),
            bank_ifsc: document.getElementById('vendorIFSC').value.trim(),
        };
        
        if (!data.name) {
            alert('Please enter company name');
            return;
        }
        
        try {
            const response = await fetch('/api/vendors/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            if (response.ok) {
                const vendor = await response.json();
                alert('✅ Vendor added successfully!');
                
                console.log('🔄 Downloading Vendor PDF for ID:', vendor.id);
                await downloadVendorPDF(vendor.id);
                
                document.getElementById('vendorForm').reset();
                document.getElementById('createVendorForm').classList.remove('show');
                loadVendors();
            } else {
                const error = await response.json();
                alert('Error: ' + JSON.stringify(error));
            }
        } catch (error) {
            alert('Error: ' + error.message);
        }
    });

    // ==================== INITIALIZE ====================
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 Page loaded, initializing vendors...');
        loadVendors();
    });
</script>
{% endblock %}
